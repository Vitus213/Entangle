services:
  opengauss:
    image: enmotech/opengauss:5.1.0
    container_name: entangle-db
    privileged: true
    environment:
      GS_PASSWORD: "Entangle@2024"
    ports:
      - "5432:5432"
    volumes:
      - opengauss_data:/var/lib/opengauss
    networks:
      - entangle-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: entangle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - entangle-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  opengauss_data:
    driver: local
  redis_data:
    driver: local

networks:
  entangle-network:
    driver: bridge
